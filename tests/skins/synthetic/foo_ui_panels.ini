# Synthetic skin for the engine's own tests (make test, make skin-lint): every script function,
# each panel kind, a popup and the native panels' art. Not meant to look good.
script = synthetic.txt
images = images
theme.accent_pvar = syn.accent
theme.index_pvar = syn.theme
theme.index_default = 1
font.default = Tahoma
font.alias.Fancy Face = Segoe UI
background.image_pvar = syn.wallpaper
background.alpha = 200
asset.bar_fill = bar{theme}.png
asset.volume_knob = knob{theme}.png
asset.nocover = nocover.png
asset.cd_case = case.png
asset.cd_case_window = 1 1 1 1
asset.rating_stars = stars{n}.png
popup.size = 300 200
mini.size = 320 120
mini.anchor = RIGHT TOP
command.Toggle panel = PVAR:SET:syn.panel:2
color.playlist.background = 10 12 16
color.highlight = #2060c0
pvar.once.syn.panel = 1
