name: Build

# Build check on every push / PR, both platforms, uploaded as artifacts:
#  - Windows x64 DLL: cross-compiled on Linux exactly like local dev (./build.sh: clang-cl +
#    lld-link + xwin), plus `make check-portable` (the platform-free code builds without
#    <windows.h>) and `make test` (host-side unit tests of the SDK-free engine parts, under
#    ASan/UBSan).
#  - macOS universal (arm64 + x86_64) .component bundle: native on a macOS runner
#    (scripts/mac-build.sh).
# A successful run on a push to main triggers release.yml (semantic-release), via workflow_run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout foo_ui_panels
        uses: actions/checkout@v7
        with:
          path: foo_ui_panels

      - name: Set up cross-build
        uses: ./foo_ui_panels/.github/actions/setup-build

      - name: Build
        working-directory: foo_ui_panels
        run: ./build.sh

      - name: Platform-free code builds without Windows headers
        working-directory: foo_ui_panels
        run: make check-portable CXX_HOST=clang++-19

      - name: Unit tests
        working-directory: foo_ui_panels
        run: |
          sudo apt-get install -y libclang-rt-19-dev # ASan/UBSan runtimes
          make test CXX_HOST=clang++-19
          make skin-lint CXX_HOST=clang++-19 LINT_DIR=tests/skins/synthetic # the engine's own test skin

      - name: Upload foo_ui_panels.dll
        uses: actions/upload-artifact@v7
        with:
          name: foo_ui_panels-dll
          path: foo_ui_panels/build/foo_ui_panels.dll
          if-no-files-found: error
          retention-days: 7

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout foo_ui_panels
        uses: actions/checkout@v7
        with:
          path: foo_ui_panels

      - name: Fetch foobar2000 SDK
        uses: ./foo_ui_panels/.github/actions/fetch-sdk

      - name: Install ninja
        run: brew install ninja

      - name: Build (universal)
        working-directory: foo_ui_panels
        run: ./scripts/mac-build.sh

      - name: Upload foo_ui_panels.component
        uses: actions/upload-artifact@v7
        with:
          name: foo_ui_panels-mac
          path: foo_ui_panels/build-mac/foo_ui_panels.component
          if-no-files-found: error
          retention-days: 7
