name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout foo_ui_panels
        uses: actions/checkout@v7
        with:
          path: foo_ui_panels
          fetch-depth: 0

      - name: Set up cross-build
        uses: ./foo_ui_panels/.github/actions/setup-build

      - name: Build (x64)
        working-directory: foo_ui_panels
        run: WIN_ARCH=x64 ./build.sh

      - name: Build (ARM64EC)
        working-directory: foo_ui_panels
        run: WIN_ARCH=arm64ec ./build.sh

      - name: Platform-free code builds without Windows headers
        working-directory: foo_ui_panels
        run: make check-portable CXX_HOST=clang++-$LLVM_VERSION

      - name: Unit tests
        working-directory: foo_ui_panels
        run: |
          make test CXX_HOST=clang++-$LLVM_VERSION
          make skin-lint CXX_HOST=clang++-$LLVM_VERSION LINT_DIR=tests/skins/synthetic

      - name: Upload foo_ui_panels.dll (x64)
        uses: actions/upload-artifact@v7
        with:
          name: foo_ui_panels-dll
          path: foo_ui_panels/build/foo_ui_panels.dll
          if-no-files-found: error
          retention-days: 7

      - name: Upload foo_ui_panels.dll (ARM64EC)
        uses: actions/upload-artifact@v7
        with:
          name: foo_ui_panels-dll-arm64ec
          path: foo_ui_panels/build-arm64ec/foo_ui_panels.dll
          if-no-files-found: error
          retention-days: 7

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout foo_ui_panels
        uses: actions/checkout@v7
        with:
          path: foo_ui_panels
          fetch-depth: 0

      - name: Fetch foobar2000 SDK
        uses: ./foo_ui_panels/.github/actions/fetch-sdk

      - name: Install ninja
        run: command -v ninja >/dev/null || brew install ninja

      - name: Build (universal)
        working-directory: foo_ui_panels
        run: ./scripts/mac-build.sh

      - name: Upload foo_ui_panels.component
        uses: actions/upload-artifact@v7
        with:
          name: foo_ui_panels-mac
          path: foo_ui_panels/build-mac/foo_ui_panels.component
          if-no-files-found: error
          retention-days: 7
