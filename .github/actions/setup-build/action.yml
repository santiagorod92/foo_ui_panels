name: Set up cross-build
description: >-
  Lays out the foobar2000 SDK as siblings of the repo checkout (the layout build.sh /
  CMakeLists.txt expect, same as foo_navidrome) and installs the Linux -> Windows x64 +
  ARM64EC cross toolchain: clang-cl, lld-link, llvm-rc/mt, cmake, ninja, plus the
  xwin-splatted Windows SDK/CRT for both arches (cached). Exports LLVM_VERSION, so later
  steps can name the matching host compiler (clang++-$LLVM_VERSION).
  Expects the repo to be checked out at $GITHUB_WORKSPACE/foo_ui_panels.

runs:
  using: composite
  steps:
    - name: Fetch foobar2000 SDK
      uses: ./foo_ui_panels/.github/actions/fetch-sdk

    - name: Check the Windows import libs are there
      shell: bash
      run: test -f foobar2000/shared/shared-x64.lib && test -f foobar2000/shared/shared-ARM64EC.lib

    - name: Install clang-cl / lld-link / cmake / ninja (LLVM 22)
      shell: bash
      run: |
        set -euo pipefail
        LLVM=22
        echo "LLVM_VERSION=$LLVM" >> "$GITHUB_ENV"
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y "clang-$LLVM" "lld-$LLVM" "llvm-$LLVM" "libclang-rt-$LLVM-dev" cmake ninja-build
        BIN="/usr/lib/llvm-$LLVM/bin"
        declare -A base=( [clang-cl]=clang [lld-link]=lld [llvm-lib]=llvm-ar
                          [llvm-rc]=llvm-rc [llvm-mt]=llvm-mt [llvm-ar]=llvm-ar )
        for t in "${!base[@]}"; do
          src=""
          for c in "$BIN/$t" "/usr/bin/$t-$LLVM" "$BIN/${base[$t]}"; do
            [ -x "$c" ] && { src="$c"; break; }
          done
          [ -n "$src" ] || { echo "missing $t (looked in $BIN)"; ls "$BIN"; exit 1; }
          sudo ln -sf "$src" "/usr/local/bin/$t"
          echo "$t -> $src"
        done
        hash -r
        clang-cl --version | head -1

    - name: Cache xwin Windows SDK/CRT splat
      id: xwin-cache
      uses: actions/cache@v6
      with:
        path: ~/.xwin
        key: xwin-${{ runner.os }}-x86_64-aarch64-v2

    - name: Splat Windows SDK/CRT with xwin
      if: steps.xwin-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cargo install xwin --locked
        xwin --accept-license --arch x86_64,aarch64 splat --output ~/.xwin
