name: Set up cross-build
description: >-
  Lays out the foobar2000 SDK as siblings of the repo checkout (the layout build.sh /
  CMakeLists.txt expect, same as foo_navidrome) and installs the Linux -> Windows x64
  cross toolchain: clang-cl, lld-link, llvm-rc/mt, cmake, ninja, plus the xwin-splatted
  Windows SDK/CRT (cached).
  Expects the repo to be checked out at $GITHUB_WORKSPACE/foo_ui_panels.

runs:
  using: composite
  steps:
    - name: Fetch foobar2000 SDK
      uses: ./foo_ui_panels/.github/actions/fetch-sdk

    - name: Check the Windows import lib is there
      shell: bash
      run: test -f foobar2000/shared/shared-x64.lib

    - name: Install clang-cl / lld-link / cmake / ninja (LLVM 19)
      shell: bash
      run: |
        set -euo pipefail
        # The MSVC STL headers xwin splats require Clang >= 19 (yvals_core.h STL1000);
        # ubuntu-24.04's default clang is 18, so pin the versioned LLVM 19 packages and point
        # the unversioned MSVC-style driver names the toolchain file uses at them.
        LLVM=19
        sudo apt-get update
        sudo apt-get install -y "clang-$LLVM" "lld-$LLVM" "llvm-$LLVM" cmake ninja-build
        BIN="/usr/lib/llvm-$LLVM/bin"
        # clang-cl / lld-link are argv[0] personalities of clang / lld: if the package doesn't
        # ship the named link, alias the base binary under that name.
        declare -A base=( [clang-cl]=clang [lld-link]=lld [llvm-lib]=llvm-ar
                          [llvm-rc]=llvm-rc [llvm-mt]=llvm-mt [llvm-ar]=llvm-ar )
        for t in "${!base[@]}"; do
          src=""
          for c in "$BIN/$t" "/usr/bin/$t-$LLVM" "$BIN/${base[$t]}"; do
            [ -x "$c" ] && { src="$c"; break; }
          done
          [ -n "$src" ] || { echo "missing $t (looked in $BIN)"; ls "$BIN"; exit 1; }
          sudo ln -sf "$src" "/usr/local/bin/$t"
          echo "$t -> $src"
        done
        hash -r
        clang-cl --version | head -1

    - name: Cache xwin Windows SDK/CRT splat
      id: xwin-cache
      uses: actions/cache@v4
      with:
        path: ~/.xwin
        key: xwin-${{ runner.os }}-v1

    - name: Splat Windows SDK/CRT with xwin
      if: steps.xwin-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cargo install xwin --locked
        xwin --accept-license splat --output ~/.xwin
